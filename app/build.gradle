plugins {
    id 'com.android.application'
}

def gdxVersion = '1.12.1'

configurations {
    natives
}

android {
    namespace 'com.example.carproject'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.carproject"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation "com.badlogicgames.gdx:gdx:$gdxVersion"
    implementation "com.badlogicgames.gdx:gdx-backend-android:$gdxVersion"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-armeabi-v7a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-arm64-v8a"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86"
    natives "com.badlogicgames.gdx:gdx-platform:$gdxVersion:natives-x86_64"

    implementation 'androidx.appcompat:appcompat:1.6.1'
}

// libGDX native .so 파일을 jniLibs 폴더에 자동 추출
task copyAndroidNatives {
    doFirst {
        ["armeabi-v7a", "arm64-v8a", "x86", "x86_64"].each { abi ->
            file("src/main/jniLibs/$abi/").mkdirs()
        }
        configurations.natives.resolvedConfiguration.resolvedArtifacts.each { artifact ->
            def outputDir = null
            switch (artifact.classifier) {
                case "natives-armeabi-v7a": outputDir = file("src/main/jniLibs/armeabi-v7a"); break
                case "natives-arm64-v8a":   outputDir = file("src/main/jniLibs/arm64-v8a");   break
                case "natives-x86":         outputDir = file("src/main/jniLibs/x86");          break
                case "natives-x86_64":      outputDir = file("src/main/jniLibs/x86_64");       break
            }
            if (outputDir != null) {
                copy {
                    from zipTree(artifact.file)
                    into outputDir
                    include "*.so"
                }
            }
        }
    }
}

preBuild.dependsOn(copyAndroidNatives)
